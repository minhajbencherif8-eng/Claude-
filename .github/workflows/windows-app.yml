name: Windows app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller

      - name: Tests (on Windows)
        run: python -m pytest -q

      - name: Build CompanyEmployeeSearch.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name CompanyEmployeeSearch
          --collect-data pdfminer
          --collect-all pypdfium2 --collect-all pypdfium2_raw
          app.py

      - name: Check the .exe imports a ZIP of PDFs
        shell: pwsh
        run: |
          python scripts/make_sample_pdfs.py samples
          Compress-Archive -Path samples/*.pdf -DestinationPath samples.zip
          $p = Start-Process -FilePath dist/CompanyEmployeeSearch.exe `
                 -ArgumentList "--selftest", "$PWD\samples.zip", "$PWD\selftest.sqlite" `
                 -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: CompanyEmployeeSearch
          path: dist/CompanyEmployeeSearch.exe

      - name: Publish on the Releases page
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-build-${{ github.run_number }}
          name: Company & Employee Search (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Download **CompanyEmployeeSearch.exe**, double-click it, then click "Select ZIP File…".
            Everything runs on your computer; nothing is uploaded.
          files: dist/CompanyEmployeeSearch.exe
